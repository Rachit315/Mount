name: Build & Release Mount

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Build Next.js static export
        run: npm --prefix renderer run build

      - name: Build Electron TypeScript
        run: npm run build:electron

      - name: Package Electron App with electron-builder
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "Mount-Windows-x64.zip" -Force

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Mount ${{ github.ref_name }}
          files: Mount-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
