name: Build & Release Mount

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # ── Windows: the build the landing page actually offers ──────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Each package is installed explicitly. The root postinstall no-ops
      # under CI so no nested npm runs inside this one.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install renderer dependencies
        run: npm ci --no-audit --no-fund
        working-directory: renderer

      - name: Build Next.js static export
        run: npm run build
        working-directory: renderer

      - name: Build Electron TypeScript
        run: npm run build:electron

      # --publish never keeps electron-builder from trying to create the
      # release itself; the release job below owns that.
      - name: Package Electron app
        run: npx electron-builder --win --dir --publish never

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "Mount-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mount-windows
          path: Mount-Windows-x64.zip
          if-no-files-found: error

  # ── macOS: best effort. A failure here must not block the release. ───
  build-macos:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install renderer dependencies
        run: npm ci --no-audit --no-fund
        working-directory: renderer

      - name: Build Next.js static export
        run: npm run build
        working-directory: renderer

      - name: Build Electron TypeScript
        run: npm run build:electron

      - name: Package Electron app
        run: npx electron-builder --mac --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create zip archive
        run: |
          APP_PATH="$(find release -maxdepth 2 -name 'Mount.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Mount.app not found under release/" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Mount-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mount-macos
          path: Mount-macOS-arm64.zip
          if-no-files-found: error

  # ── Publish whatever built. Windows is required, macOS is optional. ──
  release:
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Mount ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
